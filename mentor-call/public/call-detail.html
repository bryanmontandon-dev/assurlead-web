<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mentor Call — Fiche de call</title>
    <link rel="stylesheet" href="/css/style.css" />
    <style>
      .dimension { margin-bottom: 14px; }
      .dimension .entete {
        display: flex; justify-content: space-between; align-items: baseline;
        font-size: 13.5px; font-weight: 600; margin-bottom: 5px;
      }
      .dimension .note { font-variant-numeric: tabular-nums; }

      .bloc-point { border-left: 3px solid var(--gris-bord); padding: 2px 0 2px 14px; margin-bottom: 18px; }
      .bloc-point.fort { border-color: var(--vert); }
      .bloc-point.ameliorer { border-color: var(--ambre); }
      .citation {
        font-style: italic;
        color: var(--bleu-nuit);
        background: var(--gris-fond);
        border-radius: 6px;
        padding: 8px 11px;
        font-size: 14px;
        margin-bottom: 8px;
      }
      .commentaire { font-size: 14.5px; margin: 0 0 8px; }
      .reformulation {
        font-size: 14px; background: #eef6f3; border: 1px solid #cfe6dd;
        border-radius: 6px; padding: 9px 11px;
      }
      .reformulation strong { color: var(--vert); }

      .action-prioritaire {
        background: var(--bleu-nuit); color: var(--blanc);
        border-radius: 10px; padding: 20px 22px;
      }
      .action-prioritaire .etiquette {
        font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.8px;
        opacity: 0.75; font-weight: 700;
      }
      .action-prioritaire p { font-size: 17px; line-height: 1.45; margin: 8px 0 14px; }

      .score-cercle {
        width: 92px; height: 92px; border-radius: 50%;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        color: var(--blanc); flex: 0 0 92px;
      }
      .score-cercle .n { font-size: 30px; font-weight: 700; line-height: 1; }
      .score-cercle .l { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.5px; opacity: 0.9; }

      details.transcript summary { cursor: pointer; font-weight: 600; font-size: 14px; }
      details.transcript pre {
        white-space: pre-wrap; font-family: inherit; font-size: 14px; line-height: 1.6;
        background: var(--gris-fond); border-radius: 8px; padding: 14px; margin-top: 12px;
      }
    </style>
  </head>
  <body>
    <header class="app"></header>

    <main id="contenu">
      <p class="sous-titre">Chargement…</p>
    </main>

    <footer class="app">
      Analyse produite par Claude à partir du texte seul. Les données restent dans
      <code>data/mentor.db</code>.
    </footer>

    <script type="module" src="/js/call-detail.js"></script>
  </body>
</html>
