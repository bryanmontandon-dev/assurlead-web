<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mentor Call — Clients</title>
    <link rel="stylesheet" href="/css/style.css" />
    <style>
      label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 5px; }
      input[type='text'], input[type='number'], input[type='date'], input[type='email'], select, textarea {
        width: 100%; font-family: inherit; font-size: 14.5px; color: var(--bleu-nuit);
        padding: 9px 11px; border: 1px solid var(--gris-bord); border-radius: 8px; background: var(--blanc);
      }
      input:focus, select:focus, textarea:focus { outline: 2px solid var(--bleu-clair); outline-offset: -1px; }
      textarea { min-height: 90px; resize: vertical; line-height: 1.55; }
      .champ { margin-bottom: 13px; }
      .duo { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
      .aide { font-size: 12.5px; color: var(--gris-texte); margin: 5px 0 0; }

      .liste-client {
        display: block; width: 100%; text-align: left; background: none; border: none;
        border-top: 1px solid var(--gris-bord); padding: 12px 16px; cursor: pointer; font-family: inherit;
      }
      .liste-client:hover { background: var(--gris-fond); }
      .liste-client.actif { background: #eef3f9; }
      .liste-client .nom { font-weight: 600; font-size: 14.5px; color: var(--bleu-nuit); }
      .liste-client .meta { font-size: 12.5px; color: var(--gris-texte); margin-top: 3px; }
      .liste-client .relance { color: var(--rouge); font-weight: 600; }

      .produits { display: flex; flex-wrap: wrap; gap: 8px; }
      .produits label {
        display: flex; align-items: center; gap: 6px; font-weight: 500; font-size: 13.5px;
        border: 1px solid var(--gris-bord); border-radius: 20px; padding: 6px 12px; margin: 0; cursor: pointer;
      }
      .produits input { margin: 0; }
      .recherche { width: 100%; margin-bottom: 0; }
    </style>
  </head>
  <body>
    <header class="app"></header>

    <main>
      <div class="titre-page">
        <div>
          <h1>Clients</h1>
          <p class="sous-titre" id="sous-titre">Chargement…</p>
        </div>
        <button class="btn primaire" id="nouveau">+ Nouveau client</button>
      </div>

      <div class="grille k2" style="align-items: start; grid-template-columns: 360px 1fr">
        <section class="carte" style="padding: 0">
          <div style="padding: 14px 16px">
            <input class="recherche" type="text" id="recherche" placeholder="Rechercher un nom, une localité…" />
          </div>
          <div id="liste"></div>
        </section>

        <section id="panneau"></section>
      </div>
    </main>

    <footer class="app">
      Ces fiches restent sur ton Mac. Le nom d'un client n'est jamais envoyé à l'API d'analyse —
      seul le contexte anonymisé du call l'est.
    </footer>

    <script type="module" src="/js/clients.js"></script>
  </body>
</html>
